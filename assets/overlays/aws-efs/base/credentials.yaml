apiVersion: cloudcredential.openshift.io/v1
kind: CredentialsRequest
metadata:
  name: openshift-aws-efs-csi-driver
  namespace: openshift-cloud-credential-operator
spec:
  secretRef:
    name: aws-efs-cloud-credentials
    namespace: ${NAMESPACE}
  providerSpec:
    apiVersion: cloudcredential.openshift.io/v1
    kind: AWSProviderSpec
    statementEntries:
    # https://github.com/openshift/aws-efs-csi-driver/blob/master/docs/iam-policy-example.json
    - effect: Allow
      action:
      - elasticfilesystem:DescribeAccessPoints
      - elasticfilesystem:DescribeFileSystems
      - elasticfilesystem:DescribeMountTargets
      - s3files:ListAccessPoints
      - s3files:ListFileSystems
      - ec2:DescribeAvailabilityZones # for one-zone volumes
      resource: "*"
    - effect: Allow
      action:
      - elasticfilesystem:CreateAccessPoint
      - s3files:CreateAccessPoint
      resource: "*"
      policyCondition:
        StringLike:
          "aws:RequestTag/efs.csi.aws.com/cluster": "true"
    - effect: Allow
      action:
      - elasticfilesystem:TagResource
      - s3files:TagResource
      resource: "*"
      policyCondition:
        StringLike:
          "aws:ResourceTag/efs.csi.aws.com/cluster": "true"
    - effect: Allow
      action:
      - elasticfilesystem:DeleteAccessPoint
      - s3files:DeleteAccessPoint
      resource: "*"
      policyCondition:
        StringEquals:
          "aws:ResourceTag/efs.csi.aws.com/cluster": "true"
  # STS fields will be set by the operator
